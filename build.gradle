import groovy.json.JsonException
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

if (System.getenv('VERSION') != null) {
    mod_version = System.getenv('VERSION')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenLocal()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = 'https://maven.blamejared.com/' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Loading a world is what exercises the data stores, and a datapack reload is where
            // the item component binding trips. quickPlay gets there without a person clicking.
            if (project.hasProperty('quickPlay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('quickPlay').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Datagen is two runs now. The client/server jar split gave each side its own generator,
        // and the single 'data' type this used to ask for no longer exists, so runData failed
        // before it started any provider. clientData writes assets, serverData writes data.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "se.mickelus.mutil:mutil:${mutil_version}"
    // Curios ships for 26.1.2 now. It used to be pinned to a 1.21.1 build that refused to load,
    // so it was compile only and the dev runtime went without it, which meant the toolbelt curio
    // slot could not be exercised at all.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // The recipe viewer integrations. JEI's artifact name carries the game version, so it follows
    // minecraft_version rather than writing it out again.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // EMI Refreshed resolves from mavenLocal rather than a remote, because upstream EMI stops at
    // 1.21.1 and this is a fork. Publish it before building here, the same as mutil.
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // Secrets of Forging: Revelations, by AceTheEldritchKing, bundled rather than absorbed at his
    // request. jarJar embeds the jar and NeoForge loads it as its own mod, so it keeps its own id
    // and this project never compiles against it. It resolves from mavenLocal, so publish it first:
    //   cd "../Secrets-Of-Forging-Revelations" && ./gradlew.bat publishToMavenLocal
    // The range is what jarJar resolves against when several mods embed the same dependency, and
    // prefer names the one that ships if nothing else asks for a newer build.
    jarJar("net.acetheeldritchking.secrets_of_forging_revelations:secrets_of_forging_revelations") {
        version {
            strictly "[${sofr_version},)"
            prefer "${sofr_version}"
        }
    }

    // Art of Forging, bundled the same way and for the same reason. Publish it to mavenLocal
    // before building here, or this embeds whatever build was published last.
    jarJar("net.acetheeldritchking.art_of_forging:art_of_forging") {
        version {
            strictly "[${aof_version},)"
            prefer "${aof_version}"
        }
    }

    // jarJar puts them in the shipped jar and nowhere else, so a dev run loaded neither and the
    // boot gate had been checking a Tetra with no addons without saying so. They used to arrive by
    // way of implementation, which also put them on the compile classpath and made the build a
    // cycle. localRuntime is the half that was wanted: present when the game runs, absent when it
    // compiles.
    localRuntime "net.acetheeldritchking.secrets_of_forging_revelations:secrets_of_forging_revelations:${sofr_version}"
    localRuntime "net.acetheeldritchking.art_of_forging:art_of_forging:${aof_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            mutil_version          : mutil_version,
            mutil_version_range    : mutil_version_range,
            curios_version         : curios_version,
            curios_version_range   : curios_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            // Without these the artifactId defaults to the project directory name, which has a
            // space in it and is not a valid maven identifier, so publishing failed outright.
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
        }
    }
    repositories {
        // Upstream publishes to a local maven named by the local_maven environment variable,
        // which its Jenkins sets. Unset anywhere else, so the url became file://null and killed
        // the configuration phase before any compile ran.
        if (System.getenv("local_maven") != null) {
            maven {
                url = uri("file://${System.getenv("local_maven")}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // A port produces long error lists. Seeing all of them at once is the difference
    // between one iteration and twenty.
    options.compilerArgs.addAll(['-Xmaxerrs', '20000']) // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

processResources {
    doLast {
        if (project.hasProperty("minify")) {
            def jsonMinifyStart = System.currentTimeMillis()
            def jsonMinified = 0
            def jsonBytesSaved = 0

            fileTree(dir: outputs.files.asPath, include: '**/*.json').each {

                File file = it
                jsonMinified++
                def oldLength = file.length()
                try {
                    file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
                } catch (JsonException ignored) {
                    throw new JsonException("Failed to parse json in " + file.path)
                }
                file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
                jsonBytesSaved += oldLength - file.length()
            }

            println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + ' bytes. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
        } else {
            println('Skipping json minification')
        }
    }
}
