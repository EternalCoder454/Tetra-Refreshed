# failing the build, so a stale line reads as working right up until a private access error
# appears somewhere that looks unrelated. Nine of the sixteen entries here were stale after the
# port: three DamageSources.source overloads, a Biome temperature getter and two DripParticle
# constructors that are all public now, a GuiGraphics constructor whose class was renamed, a
# CommandSourceStack constructor Tetra never calls, and AbstractArrow, which moved package.

