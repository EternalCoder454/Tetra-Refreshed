# Build the whole mod family and fail on anything it drops on load.
#
# No publishing. Nothing here touches CurseForge or Modrinth, and nothing here makes a release.
# It answers one question, which is whether the thing still loads and still carries its data.
#
# Two jobs on purpose. The checks job needs no game and finishes in under a minute, so a broken json
# is reported almost immediately. The gate job builds five repositories and boots a server, which is
# worth waiting for but not worth waiting for in order to learn that a file has a trailing comma.
name: boot gate

on:
  push:
    branches: [26.1.2]
  pull_request:
    branches: [26.1.2]
  workflow_dispatch:

# A second push should cancel the first. The gate takes long enough that queued duplicates pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EMI Refreshed derives its version from `git rev-parse --short HEAD`, so this has to be the exact
  # commit rather than a branch. The tip of the branch would build 1.1.24-<other hash> and Tetra's
  # emi_version pin would not resolve against it.
  EMI_COMMIT: 351ba8a447489e42001f4cff3ec8b0e962f3bd2d

jobs:
  checks:
    name: json and checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tetra-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Mutil-Refreshed
          ref: 26.1.2
          path: Mutil-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Secrets-Of-Forging-Revelations-Refreshed
          ref: 26.1.2
          path: Secrets-Of-Forging-Revelations-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Art-of-Forging-Refreshed
          ref: 26.1.2
          path: Art-of-Forging-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/mc-tools
          path: mc-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: every json and mcmeta parses
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = []
          n = 0
          for pattern in ("*/src/main/resources/**/*.json", "*/src/main/resources/**/*.mcmeta"):
              for f in glob.glob(pattern, recursive=True):
                  n += 1
                  try:
                      json.load(open(f, encoding="utf-8"))
                  except ValueError as e:
                      bad.append((f, e))
          print("validated %d files" % n)
          for f, e in bad:
              print("  BAD %s: %s" % (f, e))
          sys.exit(1 if bad else 0)
          PY

      # The checker is vendored into this repository, because the shared copy it came from lives
      # in an unversioned directory a runner cannot reach.
      - name: writing rules
        # All four, and enforced. This was split into an enforced half and a reported half while
        # the semicolon ban stood, because the only violation in the family was a semicolon in a
        # sentence Ace wrote in his own README. The ban is gone, that line is fine, and there is
        # nothing left to be tactful about.
        run: |
          fail=0
          for repo in Tetra-Refreshed Mutil-Refreshed Secrets-Of-Forging-Revelations-Refreshed Art-of-Forging-Refreshed; do
            echo "--- $repo"
            ( cd "$repo" && python ../mc-tools/check-writing-rules.py $(git ls-files '*.md') ) || fail=1
          done
          exit $fail

      - name: readme style
        # One shape for every mod's README, so a reader arriving at the second one does not have to
        # learn it again. The checker states the style as well as enforcing it, run it with --style.
        run: |
          fail=0
          for repo in Tetra-Refreshed Mutil-Refreshed Secrets-Of-Forging-Revelations-Refreshed Art-of-Forging-Refreshed; do
            python mc-tools/check-readme-style.py "$repo/README.md" || fail=1
          done
          exit $fail

      - name: repository checkers
        working-directory: Tetra-Refreshed
        # Reported but not fatal, and that is not laziness. These resolve against the vanilla
        # NeoForm jar while the game runs the NeoForge patched one, so methods NeoForge adds by
        # patch read as missing. check-data-fields also reports every custom loot condition and
        # function as unrecognised. On mature code a report is a question. The gate job is the part
        # that fails a build.
        continue-on-error: true
        run: |
          for c in tools/check-*.py; do
            echo "--- $c"
            python "$c" || true
          done

  gate:
    name: build and boot
    runs-on: ubuntu-latest
    # 5 repositories, a Minecraft decompile and a server boot. The default 360 is generous, this is
    # a ceiling that still catches a genuine hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tetra-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Mutil-Refreshed
          ref: 26.1.2
          path: Mutil-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Secrets-Of-Forging-Revelations-Refreshed
          ref: 26.1.2
          path: Secrets-Of-Forging-Revelations-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/Art-of-Forging-Refreshed
          ref: 26.1.2
          path: Art-of-Forging-Refreshed

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/emi-refreshed
          ref: ${{ env.EMI_COMMIT }}
          path: emi-refreshed
          # Full history. Not sufficient on its own, see core.abbrev in the build step below.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: EternalCoder454/mc-tools
          path: mc-tools

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # EMI Refreshed is a fork built locally and published nowhere, so it has to be built here.
      # It is pinned, so the cache key is exact and a hit means it never has to be built again.
      - name: cache the local maven repository
        id: m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/dev/emi
          # The suffix is bumped whenever the way EMI is built changes, because the first run
          # cached a build whose version was a character short and a hit would keep serving it.
          key: emi-refreshed-${{ env.EMI_COMMIT }}-abbrev8

      - name: build EMI Refreshed
        if: steps.m2.outputs.cache-hit != 'true'
        working-directory: emi-refreshed
        # core.abbrev is the whole reason the first two runs failed, and it is worth the paragraph.
        #
        # EMI's version is 1.1.24-<git rev-parse --short HEAD>+26.1.2. Git chooses how far to
        # abbreviate by how many objects the repository holds, so the answer depends on the clone
        # rather than on the commit. A clean clone of emi-refreshed holds 541 objects and gives
        # seven characters, 351ba8a. The working copy this was pinned from also has link-fgfgui as
        # a second remote, holds 1122 objects, and gives eight, 351ba8a4. Tetra pins the eight.
        #
        # So the pinned version is not reproducible from a clean checkout of this repository alone,
        # and no fetch depth fixes that. Pinning the abbreviation does. If EMI's own history grows
        # enough that a local build starts producing nine, this and Tetra's emi_version move
        # together, and the check below is what will say so.
        run: |
          git config core.abbrev 8
          echo "building EMI at $(git rev-parse --short HEAD)"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --console=plain

      - name: confirm EMI published the version Tetra pins
        working-directory: Tetra-Refreshed
        # Resolution failure here reads as a generic gradle "could not find" three steps later. This
        # names the real problem, which is that the two versions disagree.
        run: |
          want=$(grep '^emi_version=' gradle.properties | cut -d= -f2)
          echo "tetra pins emi_version=$want"
          found=$(ls ~/.m2/repository/dev/emi/emi-neoforge/ 2>/dev/null || true)
          echo "mavenLocal holds: ${found:-nothing}"
          if ! echo "$found" | grep -qx "$want"; then
            echo "MISMATCH. EMI published a version Tetra does not pin."
            echo "Its version is 1.1.24-<git short hash>+26.1.2, so this is usually the hash"
            echo "abbreviating to a different length. Check fetch-depth on the emi checkout."
            exit 1
          fi

      # The dependency graph here is a cycle. Tetra bundles the two addons by jarJar, and the two
      # addons compile against Tetra. A developer's machine never notices, because mavenLocal was
      # seeded years ago, but a clean runner has nothing and something has to give first.
      #
      # Tetra gives first. jarJar is the only part of its build that wants the addons, so the first
      # pass runs without it and publishes something the addons can compile against. The second
      # pass, after they exist, is the one that bundles them and the one the gate boots.
      # build rather than publishToMavenLocal alone, because build runs the tests and publishing
      # does not. A library published without them is a library nobody checked.
      - name: mutil, tests then mavenLocal
        working-directory: Mutil-Refreshed
        run: chmod +x gradlew && ./gradlew build publishToMavenLocal --no-daemon --console=plain

      - name: keep mutil's test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutil-test-report
          path: Mutil-Refreshed/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

      - name: tetra to mavenLocal, without bundling
        working-directory: Tetra-Refreshed
        run: chmod +x gradlew && ./gradlew publishToMavenLocal -x jarJar --no-daemon --console=plain

      - name: secrets of forging to mavenLocal
        working-directory: Secrets-Of-Forging-Revelations-Refreshed
        run: chmod +x gradlew && ./gradlew build publishToMavenLocal --no-daemon --console=plain

      - name: art of forging to mavenLocal
        working-directory: Art-of-Forging-Refreshed
        run: chmod +x gradlew && ./gradlew build publishToMavenLocal --no-daemon --console=plain

      - name: rebuild tetra so the jar carries both addons
        working-directory: Tetra-Refreshed
        run: ./gradlew build --no-daemon --console=plain

      - name: confirm both addons are actually bundled
        working-directory: Tetra-Refreshed
        # A jarJar that silently resolved nothing produces a jar that loads and does half of what it
        # should, which is precisely the class of failure this whole workflow exists to catch.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          jars = [j for j in glob.glob("build/libs/*.jar") if "sources" not in j]
          if not jars:
              print("no jar was built")
              sys.exit(1)
          names = zipfile.ZipFile(jars[0]).namelist()
          bundled = [n for n in names if n.startswith("META-INF/jarjar/") and n.endswith(".jar")]
          print("jar: %s" % jars[0])
          for b in bundled:
              print("  bundled %s" % b)
          missing = [m for m in ("art_of_forging", "secrets_of_forging_revelations")
                     if not any(m in b for b in bundled)]
          if missing:
              print("NOT BUNDLED: %s" % ", ".join(missing))
              sys.exit(1)
          PY

      # Runs in a real server with a real world, which is the only place an item exists here.
      # Item components bind on world load, so a unit test cannot build an ItemStack at all.
      - name: game tests
        working-directory: Tetra-Refreshed
        run: ./gradlew runGameTestServer --no-daemon --console=plain

      - name: boot gate
        working-directory: Tetra-Refreshed
        run: python tools/boot-gate.py --no-build --keep-log

      - name: keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: Tetra-Refreshed/build/boot-gate/server.log
          if-no-files-found: warn
          retention-days: 14
